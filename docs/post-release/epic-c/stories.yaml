    records: [C2_CLOSURE_RECORD.md]
    objective: Create src/programmes/ with its public entrypoint and dependency rules in the same commit, a single-entry registry and active-definition accessor keyed by definition key cs50x-2026 (the current catalogue identity; not a persisted programme ownership identity, which waits for OD-5 in C6), and move CS50 identity, catalogue reference, external links and study guides into the CS50 definition with compatibility re-exports
    prerequisites: [C1 accepted, OD-9 recorded]
    prerequisite_status: satisfied (C1 accepted and closed; OD-9 resolved 2026-09-27, baseline cac8f23; direct owner C2-start authorization received before implementation)
    allowed_scope:
      - new src/programmes/**
      - eslint.config.js additions for the new layer (additive only)
      - localOnly guard extension to any data format introduced (additive only)
      - moduleBoundaries seed assertion replaced by an equivalent narrow assertion only if seed files move
      - features/course link and guide modules reduced to compatibility re-exports
    forbidden_scope:
      - XP, achievement, catalogue-rule, terminology or read-scope changes
      - schema, persisted values, CSS, assets, routes
      - any persisted programmeId field, stored key or backup field
      - widening the external-URL allowlist beyond the existing CS50 prefix
    required_evidence:
      - C1 link, guide and identity evidence unchanged
      - negative probes for every new ESLint rule, including a type-only import case (G-1)
      - programmes may import only the @/lib/achievements public entrypoint among lib feature modules; a lib/achievements -> programmes probe is rejected; check:circular passes
      - local-only guard coverage of the moved content's file type (G-2)
      - moduleBoundaries equivalent (G-3); sharedContracts; circular; bundle budget
    owner_decision_gates: [OD-9]
    stop_conditions:
      - a guard would have to be weakened
      - a C1 oracle would change

