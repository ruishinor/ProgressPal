      - HUD <=10, Hub <=11 and Hero <=11 logical-query evidence
      - all-three-history 1k/10k access metrics with fixture setup outside measurement
      - route-sharing and post-save consistency tests
      - A1/A2/A3 regressions and exact-commit Node24/npm11 release evidence
