name: Temporary consolidated PR112 preflight
on:
  pull_request:
    branches:
      - fix/git-m01-staging-reference
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Consolidated checks
        run: |
          failed=0
          check() {
            echo "::group::$*"
            if "$@"; then echo "PREFLIGHT PASS: $*"; else echo "PREFLIGHT FAIL: $*"; failed=1; fi
            echo "::endgroup::"
          }
          check node node_modules/vitest/vitest.mjs run --passWithNoTests=false --maxWorkers=2 --fileParallelism --bail=0
          exit "$failed"
