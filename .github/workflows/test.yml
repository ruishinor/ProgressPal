name: Release validation

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read

concurrency:
  group: release-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  final-candidate:
    name: Final candidate
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          # Both parents must be available for Git topology/control checks.
          fetch-depth: 2
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Pin npm 11
        run: npm install --global npm@11.10.1
      # Publish an ATTEST output only after verified evidence and a durable record.
      # A private, fresh output file prevents partial/crashed selector output reuse.
      - name: Select certification path
        id: reuse
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          selection=$(mktemp) || { echo 'decision=FULL' >> "$GITHUB_OUTPUT"; exit 0; }
          status=0
          GITHUB_OUTPUT="$selection" timeout 150s node --input-type=module <<'NODE' || status=$?
          import { appendFile } from 'node:fs/promises';
          let decision = 'FULL';
          try {
            const { selectCertification } = await import('./scripts/run-release-reuse.mjs');
            decision = (await selectCertification()).decision;
          } catch (error) {
            console.error(error);
            if (error.decision === 'BLOCK') process.exit(20);
          }
          if (decision === 'BLOCK') process.exit(20);
          await appendFile(process.env.GITHUB_OUTPUT,
            `decision=${decision === 'ATTEST' ? 'ATTEST' : 'FULL'}\n`);
          NODE
          case "$status" in
            0)
              if [[ "$(cat "$selection")" == 'decision=ATTEST' ]]; then
                echo 'decision=ATTEST' >> "$GITHUB_OUTPUT"
              else
                echo 'decision=FULL' >> "$GITHUB_OUTPUT"
              fi ;;
            20) echo 'Confirmed mandatory violation; certification blocked.'; exit 1 ;;
            *) echo 'FULL / VERIFIER_UNAVAILABLE'; echo 'decision=FULL' >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Install locked dependencies
        if: steps.reuse.outputs.decision != 'ATTEST'
        run: npm ci
      - name: Install Chromium
        if: steps.reuse.outputs.decision != 'ATTEST'
        run: npx playwright install --with-deps chromium
      # Review evidence is not selected here. The gate resolves it from
      # docs/release-reviews/ by its binding to this exact payload tree.
      - name: Run immutable release gate
        if: steps.reuse.outputs.decision != 'ATTEST'
        env:
          RELEASE_PASS: '1'
        run: npm run verify:release
      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: release-evidence-final-candidate
          path: |
            artifacts/release-evidence/
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 30
