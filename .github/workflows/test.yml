name: Release validation

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read

concurrency:
  group: release-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  final-candidate:
    name: Final candidate
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Pin npm 11
        run: npm install --global npm@11.10.1
      # Shadow is data only. A missing script, import/parser error, API outage or
      # deadline cannot prevent the original unconditional comprehensive gate.
      - name: Observe certification reuse (shadow)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if timeout 150s node scripts/run-release-reuse.mjs; then
            :
          else
            echo 'Reuse shadow: FULL / VERIFIER_UNAVAILABLE; comprehensive gate follows.'
          fi
      - name: Install locked dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      # Review evidence is not selected here. The gate resolves it from
      # docs/release-reviews/ by its binding to this exact payload tree.
      - name: Run immutable release gate
        env:
          RELEASE_PASS: '1'
        run: npm run verify:release
      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: release-evidence-final-candidate
          path: |
            artifacts/release-evidence/
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 30
