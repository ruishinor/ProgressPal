name: Release validation

on:
  push:
    branches:
      - master
      - cx/release-1.3.0-remediation
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pass-1:
    name: Certification pass 1
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Pin npm 11
        run: npm install --global npm@11.10.1
      - name: Install locked dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run immutable release gate
        env:
          RELEASE_MODULE: module-3-storage-durability
          RELEASE_PASS: '1'
          RELEASE_REVIEW_FILE: docs/remediation/module-3-release-review.json
        run: npm run verify:release
      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: release-evidence-pass-1
          path: |
            artifacts/release-evidence/
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 30

  pass-2:
    name: Certification pass 2
    needs: pass-1
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Pin npm 11
        run: npm install --global npm@11.10.1
      - name: Install locked dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run immutable release gate
        env:
          RELEASE_MODULE: module-3-storage-durability
          RELEASE_PASS: '2'
          RELEASE_REVIEW_FILE: docs/remediation/module-3-release-review.json
        run: npm run verify:release
      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: release-evidence-pass-2
          path: |
            artifacts/release-evidence/
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 30

  pass-3:
    name: Certification pass 3
    needs: pass-2
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Pin npm 11
        run: npm install --global npm@11.10.1
      - name: Install locked dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run immutable release gate
        env:
          RELEASE_MODULE: module-3-storage-durability
          RELEASE_PASS: '3'
          RELEASE_REVIEW_FILE: docs/remediation/module-3-release-review.json
        run: npm run verify:release
      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: release-evidence-pass-3
          path: |
            artifacts/release-evidence/
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 30
